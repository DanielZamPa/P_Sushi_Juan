<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../assets/styles/global.css">     
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <!-- Button trigger modal -->
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCarrito">
        Launch demo modal
    </button>

    <!-- Modal -->
    <div class="modal fade" id="modalCarrito" tabindex="-1" aria-labelledby="modalCarritoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="modalCarritoLabel">Carrito de Compras</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <!-- Tarjeta de producto -->
                <div class="container p-2 h-25 overflow-hidden">
                    <div class="card mb-3" id="informacionChef">
                        <div class="row g-0">
                            <div class="col-md-3">
                                <img src="../assets/img/fotoJuan.jpg"
                                    class="img-fluid rounded-start w-100 object-fit-cover h-100" alt="fotoDelChef">
                            </div>
                            <div class="col-md-6">
                                <div class="card-body">
                                    <h5 class="card-title">Juan David Diaz Lara</h5>
                                    <p class="card-text">This is a wider card with supporting text below as a
                                        natural
                                        lead-in to
                                        additional content. This content is a little bit longer.
                                    </p>
                                </div>
                            </div>
                            <div class="col-md-3 mt-auto mb-auto">
                                <div class="container d-flex">
                                    <input type="number" name="" id="" class="card border-2 p-2 w-50" placeholder="1">
                                    <button class="btn btn-close mx-2 mt-auto mb-auto"></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div> <!-- Fin tarjeta producto -->
                <br>
                <button type="button" class="btn btn-secondary" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="This top tooltip is themed via CSS variables.">
                    Custom tooltip
                </button>

                <!-- Controles de modal -->
                <div class="modal-body overflow-hidden">
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary">Pagar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

<script>
    const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
    const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))
</script>

</html>
